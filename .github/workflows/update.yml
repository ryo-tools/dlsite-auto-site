name: Auto Build DLsite Site

on:
  schedule:
    - cron: '0 13 * * *' # 日本時間 毎日22:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 過去の履歴を全て取得して競合を防止

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Build Script (Generate SEO Pages)
        run: node scripts/fetch-dlsite.js

      - name: Post to Bluesky (Free SNS Auto-Post)
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: node scripts/post-bluesky.js

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update DLsite SEO content [skip ci]" && git pull --rebase origin main && git push origin main)

      - name: Notify Discord for X Post Stock
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 成果物（latest_item.json等）があればそこから取得し、無ければ通知用ダミー/スクリプトを読み出す処理
          if [ -f scripts/notify-discord.js ]; then
            node scripts/notify-discord.js
          else
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d '{
                   "content": "【X予約投稿用ストック】\nサイト更新が完了しました！\nDiscordから最新情報をコピーしてXに予約投稿してください。\n\n**■ 親ツイート用（コピペ）**\n夜ふかしのお供にぴったりのDLsite注目作を紹介！\n耳元で聞こえる音と世界観に癒やされます…🎧\n\n#DLsite #ASMR\n👇作品の詳細・レビューはリプライ欄へ\n\n-------------------\n**■ リプライ用URL**\nhttps://dlsite-auto-site.pages.dev"
                 }' \
                 $DISCORD_WEBHOOK_URL
          fi